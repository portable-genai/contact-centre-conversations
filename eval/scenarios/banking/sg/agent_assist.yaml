# Agent-assist scenarios: retail banking, Singapore.
#
# One whole contact per scenario, replayed turn by turn. The expected labels were written FROM
# the procedure and disclosure packs by reading them, never by running the engine and recording
# what it said: a metric scored against the pipeline's own verdict is a tautology with a
# threshold.
#
# Families:
#   compliant         the contact does the right things in the right order
#   missed_disclosure a window closes unsatisfied, which must escalate
#   silent_retrieval  nothing in the corpus answers the turn, so silence is the correct output
#   cross_market      a query whose words overlap another market's corpus, to prove the
#                     partition is what produced the citations elsewhere and not term luck
mode: agent_assist
market: SG
locale: en-SG
vertical: retail_banking
tenant: demo-bank
scenarios:
- id: aa-1
  family: compliant
  contact_id: eval-aa-1
  party_ref: party-sg-0001
  expected_state: take_dispute
  expected_missed: []
  expected_due: []
  expected_citations:
  - kb-sg-005
  expected_grounded_facts:
  - Calls are recorded for quality and training
  turns:
  - role: agent
    text: Thank you for calling. This call is being recorded for quality.
    start_ms: 0
    end_ms: 7000
  - role: agent
    text: We use your information to service the account. Please confirm your date of birth.
    start_ms: 8000
    end_ms: 16000
- id: aa-2
  family: silent_retrieval
  contact_id: eval-aa-2
  party_ref: party-sg-0001
  expected_state: greeting
  expected_missed: []
  expected_due:
  - recording_notice
  expected_citations: []
  expected_grounded_facts: []
  turns:
  - role: customer
    text: Hello, is anyone there?
    start_ms: 0
    end_ms: 3000
- id: aa-3
  family: missed_disclosure
  contact_id: eval-aa-3
  party_ref: party-sg-0001
  ends_contact: true
  expected_state: take_dispute
  expected_missed:
  - recording_notice
  expected_due: []
  expected_citations: []
  expected_grounded_facts: []
  turns:
  - role: agent
    text: Thanks for calling, how can I help?
    start_ms: 0
    end_ms: 4000
  - role: agent
    text: We use your information to service the account. Confirm your date of birth please.
    start_ms: 5000
    end_ms: 14000
  - role: agent
    text: Understood, I will look into it.
    start_ms: 50000
    end_ms: 56000
- id: aa-4
  family: compliant
  contact_id: eval-aa-4
  party_ref: party-sg-0001
  expected_state: block_card
  expected_missed: []
  expected_due:
  - dispute_rights_notice
  expected_citations:
  - kb-sg-004
  expected_grounded_facts:
  - A disputed transaction is investigated
  planted: S1234567D
  turns:
  - role: agent
    text: Thank you for calling. This call is being recorded.
    start_ms: 0
    end_ms: 6000
  - role: agent
    text: We use your information to service the account. Confirm your date of birth.
    start_ms: 7000
    end_ms: 15000
  - role: customer
    text: My NRIC is S1234567D.
    start_ms: 16000
    end_ms: 19000
  - role: agent
    text: Which merchant was it, and the amount of the transaction?
    start_ms: 20000
    end_ms: 27000
- id: aa-6
  family: cross_market
  contact_id: eval-aa-6
  party_ref: party-sg-0001
  expected_state: greeting
  expected_missed: []
  expected_due:
  - recording_notice
  expected_citations: []
  expected_grounded_facts: []
  # The label the family exists for. The words of this turn overlap kb-jp-001 almost totally
  # (it IS a card balance question, in the JP corpus's own language), so a retrieval that
  # ranked by terms across the whole corpus would cite the JP passage with high confidence.
  # The market filter is what forbids that, so the honest expectation on the SG contact is
  # SILENCE: no SG passage matches the Japanese words, and the JP passage must not be
  # reachable. A citation here is not a wrong answer, it is the partition failing.
  turns:
  - role: customer
    text: カードの残高を教えてください。
    start_ms: 0
    end_ms: 3000
- id: aa-5
  family: compliant
  contact_id: eval-aa-5
  party_ref: party-sg-0001
  expected_state: explain_outcome
  expected_missed: []
  expected_due: []
  expected_citations:
  - kb-sg-004
  expected_grounded_facts:
  - A disputed transaction is investigated
  turns:
  - role: agent
    text: Thank you for calling. This call is being recorded.
    start_ms: 0
    end_ms: 6000
  - role: agent
    text: We use your information to service the account. Confirm your date of birth.
    start_ms: 7000
    end_ms: 15000
  - role: agent
    text: Which merchant was it?
    start_ms: 16000
    end_ms: 20000
  - role: agent
    text: You have the right to dispute this in writing. I have blocked the card.
    start_ms: 21000
    end_ms: 30000
