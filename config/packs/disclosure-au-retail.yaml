# Disclosure pack: Australia retail contact-centre disclosures (FICTIONAL policy).
#
# THIS SHAPE IS SHARED WITH E3 (conversation-qa-scorecard) on purpose. The live copilot reminds
# an agent that a window is open; the post-contact scorecard grades whether the reminder worked.
# Both read THIS artifact, so a market's requirement is reviewed once and cannot drift.
#
# The row that is here and nowhere else is `hardship_referral_notice`. In this market a customer
# saying they are in financial hardship starts a defined process with an obligation attached, and
# the agent owes them the referral in words rather than a sympathetic noise. It is severity high
# and it has the tightest window in the file for that reason.
kind: disclosure
pack_id: au-retail-disclosures-v1
market: AU
vertical: retail_banking
jurisdiction: ASIC
locale: en-AU

disclosures:
  - disclosure_id: recording_notice
    required_phrase: this call is being recorded
    paraphrases:
      - we record all calls
      - the call is recorded
      - this call may be recorded
    trigger_event: contact_start
    within_ms: 45000
    severity: high
    reminder: >-
      Give the call-recording notice now; the window closes 45 seconds after the call starts.
    role: agent
  - disclosure_id: data_use_notice
    required_phrase: we use your information to
    paraphrases:
      - your information is used to
      - your personal data is used to
    trigger_event: procedure_state:verify_identity
    within_ms: 60000
    severity: medium
    reminder: State the purpose of the personal data you are about to collect.
    role: agent
  - disclosure_id: hardship_referral_notice
    required_phrase: we can refer you to our hardship team
    paraphrases:
      - our financial hardship team can help
      - i can refer you to hardship assistance
    trigger_event: lexicon:hardship_raised
    within_ms: 30000
    severity: high
    reminder: >-
      The caller has raised financial hardship. Refer them to the hardship team in words, now.
    role: agent
