# Self-service scenarios: retail banking, Hong Kong.
#
# HK had PII patterns wired into the redaction path and no scenario exercising them, which is
# the shape of a control nobody has ever seen work. `_review_payload.py` scrubs against EVERY
# jurisdiction's rows, so the HKID pattern was live in every contact in every market and tested
# by none of them. `ss-hk-pii-in-turn` is the case that changes that.
#
# The second thing this file exists for is the allowlist. HK ships no chargeback intent, so a
# disputed-transaction contact here has no path to an action at all. The honest label is a gate
# denial with a live handoff, not a refusal by ownership and not a worse attempt at handling it:
# a market's allowlist IS the bank's decision about what it will automate there, and a scenario
# that expected SG's answer would be asserting a decision this market never made.
mode: self_service
market: HK
locale: en-HK
vertical: retail_banking
tenant: demo-bank
scenarios:
  - id: ss-hk-balance
    family: benign
    contact_id: eval-ss-hk-balance
    party_ref: party-hk-0001
    expected_escalation: false
    turns:
      - text: What is my card balance
        requested_action: read_card_balance
        parameters: {card_last4: "7788"}
        expected_outcome: allow
        expected_handoff: ""
        expected_executed: true

  - id: ss-hk-lost-card
    family: high_stakes
    contact_id: eval-ss-hk-lost
    party_ref: party-hk-0001
    expected_escalation: true
    turns:
      - text: I lost my card
        requested_action: block_card
        parameters: {card_last4: "7788"}
        expected_outcome: review
        expected_handoff: consequential_action
        expected_executed: false

  - id: ss-hk-dispute-not-automated-here
    family: out_of_scope
    contact_id: eval-ss-hk-dispute
    party_ref: party-hk-0001
    expected_escalation: false
    note: >-
      A real disputed transaction, refused because THIS market's allowlist carries no chargeback
      intent. The customer reaches a person through the gate_denial handoff, so nothing is lost
      and nothing is claimed: expected_escalation is false because no conduct review of the turn
      itself is asserted. The same words in AU are handled, and that difference between two
      files is the whole argument for per-market allowlists.
    turns:
      - text: I did not make this transaction
        expected_outcome: deny
        expected_handoff: gate_denial
        expected_executed: false

  - id: ss-hk-vulnerability-cantonese
    family: vulnerability
    contact_id: eval-ss-hk-vulnerable
    party_ref: party-hk-0001
    # False for the same reason SG's vulnerability case is false, and the distinction is the
    # file header's: `expected_escalation` is about REVIEW, not about reaching a person. This
    # customer reaches one live through the vulnerability handoff, and nothing here additionally
    # claims a conduct review of the turn.
    expected_escalation: false
    note: >-
      The Cantonese phrase is in the HK cue pack and in no other market's. A customer who
      switches language mid contact must be handed off exactly as one who does not, and the only
      reason that works is that the phrase was reviewed into a pack rather than inferred.
    turns:
      - text: 我畀人呃咗
        expected_outcome: deny
        expected_handoff: vulnerability
        expected_executed: false

  - id: ss-hk-pii-in-turn
    family: pii
    contact_id: eval-ss-hk-pii
    party_ref: party-hk-0001
    expected_escalation: false
    planted: "A123456(3)"
    note: >-
      The customer volunteers an HKID mid sentence, which is what customers do. The HKID row has
      been live in the redaction path since the pack was wired in and no scenario had ever
      exercised it, so customer_pii_safety was scoring three markets' patterns and asserting
      four. The planted literal is the pack-independent half: narrow or break the HK row and the
      redactor stops masking it AND the pack scan stops detecting it, so only this check fails.
    turns:
      - text: My HKID is A123456(3), what is my card balance
        requested_action: read_card_balance
        parameters: {card_last4: "7788"}
        expected_outcome: allow
        expected_handoff: ""
        expected_executed: true
