# Narrative quality floors, per Hrz4 promotion bundle. Owner: model risk.
#
# These are the ONLY numbers in this service that say how good a generated reply has to be, as
# opposed to whether it was allowed, grounded, cited or safe. Everything else the eval measures
# is deterministic and binary; this is the half that needs a judge, and a judge needs a bar.
#
# Two bars per vertical, and the difference between them is the point:
#   floor   below this the profile MUST NOT serve this vertical. Not "degraded". Unfit.
#   target  at or above this the profile is at full quality. Between the two it is DEGRADED:
#           usable, and visibly worse, which is the band the portability story describes in
#           words and which nothing measured until now.
#
# A vertical gets a floor only once it has narrative cases in the golden set. A floor with
# nothing behind it is a number that has never refused anything.
#
# The self-service bar is HIGHER than the agent-assist bar, and deliberately so. A trained
# employee reads the agent-assist panel and can discard a weak suggestion before anybody hears
# it. Nobody stands between the self-service reply and a member of the public.
schema = "quality-floors/v1"
owner = "model risk (Hrz4 promotion authority)"

[verticals.contact-centre-conversations-agent-assist]
floor = 0.72
target = 0.90
note = "A whisper panel a trained agent reads and may discard before speaking."

[verticals.contact-centre-conversations-self-service]
floor = 0.80
target = 0.92
note = "Customer-facing: nobody reviews this before the customer reads it."
