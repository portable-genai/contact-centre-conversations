# Disclosure pack: Hong Kong retail contact-centre disclosures (FICTIONAL policy).
#
# THIS SHAPE IS SHARED WITH E3 (conversation-qa-scorecard) on purpose. The live copilot reminds
# an agent that a window is open; the post-contact scorecard grades whether the reminder worked.
# Both read THIS artifact, so a market's requirement is reviewed once and cannot drift.
#
# The HK window is 30 seconds rather than SG's 45, and that number is the reason the pack exists
# per market. A copy of SG's file with the jurisdiction relabelled would report compliance
# against a window nobody in this market agreed to, which is the worst kind of green.
kind: disclosure
pack_id: hk-retail-disclosures-v1
market: HK
vertical: retail_banking
jurisdiction: HKMA
locale: en-HK

disclosures:
  - disclosure_id: recording_notice
    required_phrase: this call is being recorded
    paraphrases:
      - we record all calls
      - the call is recorded
      - this call may be recorded
    trigger_event: contact_start
    within_ms: 30000
    severity: high
    reminder: >-
      Give the call-recording notice now; the HK window closes 30 seconds after the call starts.
    role: agent
  - disclosure_id: data_use_notice
    required_phrase: we use your information to
    paraphrases:
      - your information is used to
      - your personal data is used to
    trigger_event: procedure_state:verify_identity
    within_ms: 60000
    severity: medium
    reminder: State the purpose of the personal data you are about to collect.
    role: agent
