name: CI

# Thin caller of the shared reusable hard-gate workflow. Bumping the
# gate for every catalog repo is a change to the ref below, not N per-repo edits.
#
# The ref is a TAG of hex-service-template, not a branch: a moving ref would silently change what
# this repo's gate means. Bump it deliberately when the shared workflow releases.
#
# The lockfile inputs make the CI install reproducible (practices check D1) and let the
# supply-chain job's pip-audit judge exactly the versions CI and the image install. Recompile the
# locks with `make lock` after any dependency change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    uses: portable-genai/hex-service-template/.github/workflows/hard-gate.yaml@v0.0.1
    with:
      python-versions: '["3.12", "3.13"]'
      run-eval: true
      eval-command: "python eval/run_eval.py"
      dev-lockfile: "requirements-dev.lock"
      runtime-lockfile: "requirements-gcp.lock"
      # The IAP negative matrix cannot run in the SDK-free gate above, because google-auth is
      # deliberately not in the dev lockfile. Naming it here gives it a job that installs the
      # RUNTIME lockfile and runs it with the require-flag on, so the one adapter whose
      # declaration stands the exposure guard down is not the one adapter nobody tests. The job
      # is still offline: the signing key is minted in-process and the key-set fetch is served
      # in-process.
      iap-matrix-path: "tests/unit/test_iap_crypto_matrix.py"

  terraform:
    name: terraform fmt + validate + test
    runs-on: ubuntu-latest
    # The deploy posture is only enforceable if it is CHECKED, and practice D5 asks for that
    # check to run in CI without cloud credentials. Everything here is offline: no backend, no
    # project, no credentials. A drifted format, a dangling reference or a broken residency
    # validation fails the PR rather than the apply.
    #
    # `terraform test` runs too, because the .tftest.hcl uses mock_provider and plan-only runs.
    # It is the half that carries the refusals: out-of-region region, retention below the
    # floor, a mutable image tag, an edge with no review console. Those are the assertions that
    # would otherwise be true only in the commit message.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform fmt (check)
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Terraform test (mocked providers, no credentials)
        run: terraform -chdir=infra/terraform test
