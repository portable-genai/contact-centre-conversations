# Action catalog: what a machine may be ASKED to do, and which of those a machine may never do.
#
# `consequential` is the maker-checker line and it is REQUIRED on every entry: an action whose
# catalog forgot to say is treated as consequential, and a silent default is how that gets
# forgotten. A consequential action never auto-executes, whatever the gate decided.
#
# `binds_to_party` is the ownership line and it is REQUIRED on every parameter. A pattern
# proves shape and nothing else: "[0-9]{4}" cannot tell one customer's card from another's,
# so a value that NAMES a record somebody owns is checked against who is asking before the
# action runs. Both card and transaction references here name records; a parameter that
# named, say, a date range would say false.
kind: actions
catalog_id: retail-actions-v1
vertical: retail_banking

actions:
  - action_id: read_card_balance
    title: Read the current card balance
    consequential: false
    severity: low
    parameters:
      - name: card_last4
        kind: string
        required: true
        pattern: "[0-9]{4}"
        binds_to_party: true
  - action_id: read_recent_transactions
    title: List the last five transactions
    consequential: false
    severity: low
    parameters:
      - name: card_last4
        kind: string
        required: true
        pattern: "[0-9]{4}"
        binds_to_party: true
  - action_id: block_card
    title: Block the card
    consequential: true
    severity: high
    parameters:
      - name: card_last4
        kind: string
        required: true
        pattern: "[0-9]{4}"
        binds_to_party: true
  - action_id: raise_chargeback
    title: Raise a chargeback against a transaction
    consequential: true
    severity: critical
    parameters:
      - name: card_last4
        kind: string
        required: true
        pattern: "[0-9]{4}"
        binds_to_party: true
      - name: transaction_ref
        kind: string
        required: true
        pattern: "TXN-[0-9]{6}"
        binds_to_party: true
